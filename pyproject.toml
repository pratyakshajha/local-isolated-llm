[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-isolated-llm"
version = "0.1.0"
description = "Run and chat with language models locally"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "torch==2.14.1",
    "huggingface-hub==1.31.0",
    "filelock==4.2.1",
    "transformers==5.20.2",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "fastapi==0.161.0",
    "uvicorn[standard]==0.54.0",
    "rich==14.1.0",
    "psutil==7.0.0",
]

[project.optional-dependencies]
test = ["httpx2==2.14.0"]

[project.scripts]
local-llm = "app.main:main"
local-llm-server = "app.api.server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
