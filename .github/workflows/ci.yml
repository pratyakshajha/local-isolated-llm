name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install PyYAML==6.0.3 fastapi==0.161.0 uvicorn==0.54.0 rich==14.1.0 psutil==7.0.0 httpx2==2.16.0 ruff==0.12.12
      - name: Lint Python
        run: python -m ruff check app tests
      - name: Validate shell helper scripts
        run: bash -n scripts/*.sh
      - name: Run backend tests
        run: python -m unittest discover -v
      - name: Audit pinned Python dependency graph
        run: |
          python -m pip install pip-audit
          pip-audit -r .github/requirements-audit.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Run frontend tests and production build
        working-directory: frontend
        run: |
          npm test
          npm run build

  container-image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag local-isolated-llm:ci .
      - name: Scan container image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: local-isolated-llm:ci
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
