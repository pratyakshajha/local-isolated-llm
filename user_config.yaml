# gemma_small, qwen3-8b, llama-2-7b-chat-hf, llama-2-13b-chat-hf, mistral-7B-v0.1, gemma-7B-v1.0
active_model: gemma_small
runtime: transformers
system_prompt: You are a helpful assistant.
max_history_turns: 4

generation:
  temperature: 0.8
  top_p: 0.95
  max_tokens: 512

server:
  host: 127.0.0.1
  port: 8080

system_prompt: |
  You are a helpful assistant.
  Keep answers concise: lead with the answer and use a few sentences or bullets.
  Give more detail only when I ask or when it’s needed for correctness.

generation:
  max_tokens: 256